<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davetlisiniz!</title>
    <style>
        /* Modern & Minimalist Stil */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f1ea;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid #e0dbcf;
        }

        .ornament {
            font-size: 24px;
            color: #c5a880;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 2.5rem;
            color: #2c3e50;
            margin-top: 10px;
            margin-bottom: 20px;
            font-weight: normal;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
        }

        .details {
            margin: 30px 0;
            padding: 20px;
            background-color: #faf9f6;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .details div {
            margin: 10px 0;
            font-size: 1rem;
        }

        .details strong {
            color: #c5a880;
        }

        /* Geri Sayım Sayacı */
        #countdown {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            font-weight: bold;
        }

        .countdown-item {
            background: #2c3e50;
            color: white;
            padding: 10px;
            border-radius: 8px;
            width: 60px;
        }

        .countdown-item span {
            display: block;
            font-size: 0.8rem;
            font-weight: normal;
            color: #ddd;
        }

        /* Butonlar */
        .btn {
            display: inline-block;
            background-color: #c5a880;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
            margin-top: 15px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            background-color: #b3956b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="ornament">✦ ❁ ✦</div>
        <h1>Davetlisiniz!</h1>
        <p>Hayatımızın bu en özel gününde, mutluluğumuzu bizimle paylaşmanızdan onur duyarız.</p>
        
        <div class="details">
            <div><strong>Tarih:</strong> 25 Eylül 2026</div>
            <div><strong>Saat:</strong> 19:30</div>
            <div><strong>Yer:</strong> İstanbul Sevgi Salonu</div>
        </div>

        <p style="font-size: 0.9rem; color: #888;">Etkinliğe Kalan Süre</p>
        <div id="countdown">
            <div class="countdown-item" id="days">00<span>Gün</span></div>
            <div class="countdown-item" id="hours">00<span>Saat</span></div>
            <div class="countdown-item" id="minutes">00<span>Dk</span></div>
        </div>

        <a href="https://maps.google.com" target="_blank" class="btn">Konumu Gör / Yol Tarifi</a>
    </div>

    <script>
        // Geri sayım için hedef tarih (Yıl, Ay [0-11], Gün, Saat, Dakika)
        // Dikkat: JavaScript'te aylar 0'dan başlar (Eylül = 8)
        const targetDate = new Date(2026, 8, 25, 19, 30, 0).getTime();

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // Zaman hesaplamaları
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));

            // HTML'e yazdırma
            document.getElementById("days").innerHTML = days + "<span>Gün</span>";
            document.getElementById("hours").innerHTML = hours + "<span>Saat</span>";
            document.getElementById("minutes").innerHTML = minutes + "<span>Dk</span>";

            // Süre dolduğunda
            if (difference < 0) {
                clearInterval(countdownInterval);
                document.getElementById("countdown").innerHTML = "Etkinlik Başladı!";
            }
        }, 1000);
    </script>

</body>
</html>
